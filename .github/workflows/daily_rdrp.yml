name: Daily AntiviralDB RdRP Google Sheet Sync

on:
  schedule:
    # 每 12 小時執行一次 (UTC 00:00 與 12:00，相當於台灣時間 08:00 與 20:00)
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas gspread google-auth tqdm

      - name: Run script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SA_KEY }}
        run: python rdrp_inhibitor_collector.py

      # -------------------------------------------------------------
      # 執行成功或失敗均觸發發送 Email 通知
      # -------------------------------------------------------------
      - name: Send status notification email
        if: always() # 確保前一步驟無論成功或失敗都會執行此 Step
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "GitHub Action [${{ job.status }}]: Daily AntiviralDB RdRP Sync"
          # 若 Secrets 中的 MAIL_TO 缺失，預設退回使用 MAIL_USERNAME 作為收件人，防止報錯
          to: ${{ secrets.MAIL_TO || secrets.MAIL_USERNAME }}
          from: "GitHub Actions Automator <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Daily AntiviralDB RdRP Google Sheet Sync 工作已完成。

            * 執行結果 (Status): ${{ job.status }}
            * 觸發事件 (Event): ${{ github.event_name }}
            * 觸發分支 (Branch): ${{ github.ref_name }}
            * 紀錄日誌 (Run URL): https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
