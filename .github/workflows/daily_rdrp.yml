name: Daily PubChem & ChEMBL RdRP Inhibitor Collector

on:
  schedule:
    # 每天台灣時間 08:00 (UTC 00:00) 自動執行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁介面上手動點擊按鈕觸發執行

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # 1. 檢出儲存庫專案程式碼
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. 設定 Python 環境 (3.10)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 安裝依賴套件 (requests, pandas, gspread, google-auth)
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests pandas gspread google-auth; fi

    # 4. 執行隨機挑選病毒並抓取 PubChem/ChEMBL/NCBI 資料與寫入 Google Sheet
    - name: Run Fetch Script and Update Google Sheet
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      run: |
        python rdrp_inhibitor_collector.py

    # 5. 成功後寄送 Email 通知
    - name: Send Email Notification on Success
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "📊 [自動化任務成功] RNA 病毒 RdRP 抑制劑試算表更新完成"
        to: ${{ secrets.RECEIVER_EMAIL }}
        from: "PubChem Automation Bot"
        body: "最新隨機抽查的 RNA 病毒 RdRP 抑制劑與活性數據已順利寫入 Google Sheet 對應分頁！"

    # 6. 失敗時透過 cURL 發送 Discord Webhook 通知
    - name: Send Discord Notification on Failure
      if: failure()
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        if [ -n "$DISCORD_WEBHOOK" ]; then
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "🚨 **[RdRP Collector 執行失敗]**\n請檢查 GCP_SA_KEY、GOOGLE_SHEET_ID 或前往 GitHub Actions 查看失敗 Log。"}' \
               "$DISCORD_WEBHOOK"
        else
          echo "未偵測到 DISCORD_WEBHOOK Secret，跳過 Discord 提醒。"
        fi
