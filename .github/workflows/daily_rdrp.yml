name: Daily PubChem RdRP Inhibitor to Google Sheet & Email Report

on:
  schedule:
    # 每天台灣時間 08:00 (UTC 00:00) 執行
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Fetch Script, Update Sheet & Generate Summary
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      run: |
        python scripts/fetch_rdrp_inhibitors.py

    # 成功後：寄送分析摘要報告 Email
    - name: Send Summary Email on Success
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "📊 [每日自動報告] PubChem RNA 病毒 RdRP 抑制劑更新與數據分析"
        to: ${{ secrets.RECEIVER_EMAIL }}
        from: "PubChem Automation Bot"
        body: file://data/email_summary.txt # 讀取 Python 產出的分析報告檔案

    # 失敗時：發送 Discord 失敗提醒
    - name: Send Discord Notification on Failure
      if: failure()
      uses: IlshatSk/discord-webhook-action@v1.0.0
      with:
        webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
        content: "🚨 **[PubChem to Google Sheet 執行失敗]**\n請前往 GitHub Actions 查看 Log。"
